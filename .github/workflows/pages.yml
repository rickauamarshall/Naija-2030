name: Deploy site to GitHub Pages

# Serves site/index.html at https://<owner>.github.io/<repo>/ without
# moving the file to repo root or /docs. Requires a one-time manual step:
# repo Settings -> Pages -> Source -> "GitHub Actions" (can't be set via
# a workflow file - a human with repo admin access has to click it once).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
